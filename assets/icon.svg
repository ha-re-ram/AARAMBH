<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8fa"/>
      <stop offset="100%" stop-color="#ffe4ea"/>
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#ff6b8b"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff8fa3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with subtle border -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#ffccd5" stroke-width="8"/>

  <!-- Angelic Lotus / Flower Motifs -->
  <g filter="url(#softGlow)">
    <!-- Outer Side Petals Left -->
    <path d="M 256 360 C 140 330 90 220 120 150 C 160 210 210 280 256 360 Z" fill="url(#petalGrad2)" opacity="0.85"/>
    <!-- Outer Side Petals Right -->
    <path d="M 256 360 C 372 330 422 220 392 150 C 352 210 302 280 256 360 Z" fill="url(#petalGrad2)" opacity="0.85"/>

    <!-- Mid Petals Left -->
    <path d="M 256 370 C 170 330 140 200 180 110 C 210 190 240 270 256 370 Z" fill="url(#petalGrad1)" opacity="0.9"/>
    <!-- Mid Petals Right -->
    <path d="M 256 370 C 342 330 372 200 332 110 C 302 190 272 270 256 370 Z" fill="url(#petalGrad1)" opacity="0.9"/>

    <!-- Center Main Petal -->
    <path d="M 256 380 C 200 270 210 150 256 70 C 302 150 312 270 256 380 Z" fill="url(#centerGrad)"/>

    <!-- Sacred Golden Core Sparkle -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.9"/>
    <circle cx="256" cy="256" r="16" fill="#fde047"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>
  </g>
</svg>